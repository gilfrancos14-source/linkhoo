name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      # Le build Vite échoue là où `tsc -b` passe (import cassé, asset manquant).
      - run: npm run build
      # Informatif uniquement : ne bloque pas la CI tant qu'aucun correctif
      # n'existe en amont (cas axios transitif via fedapay côté backend).
      - run: npm audit --audit-level=high
        continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Pré-vol SQL : lit les fichiers de migration et la base cible
      # (lecture seule). Sans secret, on saute proprement.
      - name: Pré-vol des migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL absent — pré-vol ignoré"
            exit 0
          fi
          npm run migrate:check
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true

  # Parcours Playwright : le serveur de dev Vite est lancé par Playwright et
  # toutes les appels /api/** sont interceptés dans le navigateur (aucun
  # backend, aucune base). Sans frontend/.env, Clerk afficherait
  # « Configuration manquante » : on injecte la même clé publique de
  # développement que celle déjà présente dans src/test/setup.ts.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZXBpYy1zcG9uZ2UtODkzMy5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

  # PWA hors-ligne : build de production servi par `e2e/offline-server.mjs`,
  # service worker ACTIF (contrairement au job e2e où les SW sont bloqués).
  # Les fetch émis depuis le SW ne passent pas par `page.route()` : les mocks
  # sont donc servis par le serveur local, pas interceptés par Playwright.
  e2e-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZXBpYy1zcG9uZ2UtODkzMy5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # `test:e2e:offline` = `npm run build` + specs offline (config dédiée).
      - run: npm run test:e2e:offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-offline-results
          path: frontend/test-results/
          retention-days: 7
