# Production Ilehya — VPS LWS (4 vCPU / 8 Go, Ubuntu 24.04).
#
# Nginx et Certbot sont installés sur l'hôte (apt) : le renouvellement des
# certificats et le montage de /var/www sont plus simples hors conteneur.
# Ici : PostgreSQL 16 + Redis (jobs/rate-limit) + 4 instances de l'API.
#
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm api1 \
#     node dist/db/migrateCli.js --yes
#
# Fichier d'environnement : backend/.env.prod (hors dépôt).

name: ilehya

# Configuration commune aux 4 instances de l'API (ancre YAML).
x-api-common: &api-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: ilehya-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - ./backend/.env.prod
  environment: &api-env
    NODE_ENV: production
    PORT: 3001
    # La base est dans le réseau Docker : on parle au nom du service.
    DATABASE_URL: postgresql://${POSTGRES_USER:-ilehya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ilehya}
    # Redis local partagé : compteurs de rate-limit + élection du leader
    # pour que les jobs périodiques ne tournent que sur UNE instance.
    REDIS_URL: redis://redis:6379
    # En cluster, Redis indisponible = on ne devient PAS leader (évite 4× les
    # jobs). Sans ce flag, un Redis down ferait tourner les jobs partout.
    CLUSTER_MODE: "true"
    STORAGE_DIR: /app/storage
  volumes:
    # Bind mount : le stockage vit sur l'hôte, là où Nginx le sert
    # (/var/lib/ilehya/storage) et là où backup.sh l'archive.
    - /var/lib/ilehya/storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
    interval: 30s
    timeout: 5s
    start_period: 40s
    retries: 3
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilehya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilehya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe PostgreSQL requis}
      POSTGRES_DB: ${POSTGRES_DB:-ilehya}
    volumes:
      - ilehya_pgdata:/var/lib/postgresql/data
      - ./deploy/backup:/backup
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ilehya} -d ${POSTGRES_DB:-ilehya}"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ilehya-redis
    restart: unless-stopped
    # Pas de persistence : le rate-limit et le verrou de leader peuvent
    # redémarrer à zéro, ce n'est pas de la donnée métier.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 4 instances sur 4 ports hôte : Nginx répartit avec un upstream.
  # On ne publie que sur 127.0.0.1 : Nginx (hôte) est le seul client.
  api1:
    <<: *api-common
    container_name: ilehya-api-1
    ports:
      - "127.0.0.1:3001:3001"

  api2:
    <<: *api-common
    container_name: ilehya-api-2
    ports:
      - "127.0.0.1:3002:3001"

  api3:
    <<: *api-common
    container_name: ilehya-api-3
    ports:
      - "127.0.0.1:3003:3001"

  api4:
    <<: *api-common
    container_name: ilehya-api-4
    ports:
      - "127.0.0.1:3004:3001"

  # Traduction asynchrone des contenus (chambres) avec OPUS-MT.
  # Une seule instance, un job à la fois : aucun pic CPU pendant les saves.
  translator:
    image: ilehya-backend:${IMAGE_TAG:-latest}
    container_name: ilehya-translator
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ilehya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ilehya}
      I18N_CACHE_DIR: /app/i18n-model
    command: ["node", "scripts/translationWorker.mjs"]
    # Le worker ne sert pas HTTP : le HEALTHCHECK de l'image ne s'applique pas.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  ilehya_pgdata:
