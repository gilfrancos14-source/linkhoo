# Nginx — Ilehya (VPS LWS, Ubuntu 24.04)
#
# Installation :
#   cp deploy/nginx/ilehya.conf /etc/nginx/sites-available/ilehya
#   ln -s /etc/nginx/sites-available/ilehya /etc/nginx/sites-enabled/
#   # le certificat est obtenu après avoir mis le site en HTTP :
#   certbot --nginx -d linkehoo.com -d www.linkehoo.com
#   nginx -t && systemctl reload nginx
#
# Domaine configuré : linkehoo.com (www inclus). Si vous changez le script
# inline de prefetch dans frontend/index.html, recalculez le hash CSP ci-dessous.

map $http_upgrade $connection_upgrade {
    default upgrade;
    # Vide (et non "close") pour les requêtes normales : cela permet le
    # keepalive de l'upstream. Seules les requêtes WebSocket passent en upgrade.
    ''      '';
}

# ── 4 instances de l'API sur le même serveur (4 vCPU) ──
# `least_conn` envoie chaque requête à l'instance la moins occupée.
# `keepalive` réutilise les connexions en amont (important pour le débit).
upstream ilehya_api {
    least_conn;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3004 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── Cache des réponses API publiques (soulage les 4 instances Node) ──
# Clé = URI complète (inclut la query string : market, filtres, page…).
# 200 Mo max, inactivité 2 min, répertoire sur le disque du VPS.
proxy_cache_path /var/cache/nginx/ilehya_api levels=1:2 keys_zone=ilehya_api_cache:10m
                 max_size=200m inactive=2m use_temp_path=off;

# WHITELIST : seuls ces GET publics et non personnalisés sont cachables.
# $api_uri_no_cache : 0 = mettre en cache, 1 = ne pas cacher.
# Par défaut (tout le reste : auth, admin, réservations, notifications,
# gérants, payouts, upload…) = 1 → aucun cache.
# /api/rooms/mine est exclu explicitement (données personnelles du gérant).
map $request_uri $api_uri_no_cache {
    default                     1;
    ~^/api/health(\?|$)         0;
    ~^/api/categories(\?|$)     0;
    ~^/api/events(\?|$)         0;
    ~^/api/tourism(\?|$)        0;
    ~^/api/escapades(\?|$)      0;
    ~^/api/banners(\?|$)        0;
    ~^/api/reviews/featured(\?|$) 0;
    ~^/api/reviews/mine(\?|$)   1;
    ~^/api/reviews(\?|$)        0;
    ~^/api/rooms/mine(\?|$)     1;
    ~^/api/rooms(\?|$)          0;
    ~^/api/rooms/               0;
}

# Sécurité : SEULS les GET/HEAD sont cachables. Combine avec la map URI :
# proxy_no_cache reçoit les deux variables ; le cache est bypassé dès que
# l'une vaut 1. Sans cette garde, une réponse POST /api/rooms (200) pourrait
# être stockée sous la même clé URI qu'un GET et servie à un autre utilisateur.
map $request_method $api_method_no_cache {
    default 1;
    GET     0;
    HEAD    0;
}

# ── Limitation de débit (anti-abus avant même d'atteindre l'API) ──
limit_req_zone $binary_remote_addr zone=ilehya_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ilehya_upload:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name linkehoo.com www.linkehoo.com;

    # Certbot réécrit ce bloc pour ajouter le HTTPS et le redirectionnement.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Syntaxe compatible Nginx 1.24 (Ubuntu 24.04) : http2 sur le listen,
    # et non la directive `http2 on;` apparue en 1.25.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linkehoo.com www.linkehoo.com;

    ssl_certificate     /etc/letsencrypt/live/linkehoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkehoo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Sécurité ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP : le seul script inline est le prefetch de index.html — il est
    # autorisé par son hash SHA-256, pas par 'unsafe-inline'. Les styles
    # dynamiques de React restent autorisés uniquement via style-src-attr.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-H5xzxenZGlJYfa/GO9WQf5jeMozHRK8F6j9BLxg4Edg=' https://*.clerk.accounts.dev; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.clerk.accounts.dev https://api.pawapay.io https://checkout.pawapay.io wss:; frame-src https://*.clerk.accounts.dev https://checkout.pawapay.io; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 12m;
    server_tokens off;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # ── Frontend (build Vite) ──
    root /var/www/ilehya;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pages de retour de paiement : la référence pawaPay voyage dans l'URL.
    # On interdit sa transmission comme Referer et on évite tout cache.
    location ~ ^/[a-z]{2}/(reservation/paiement|gerant/premium/success)/?$ {
        try_files $uri $uri/ /index.html;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Photos d'annonces (stockage disque) ──
    # Les URLs stockées en base sont `<STORAGE_PUBLIC_BASE_URL>/images/<fichier>`,
    # soit `https://linkehoo.com/media/images/<fichier>` avec
    # STORAGE_PUBLIC_BASE_URL=https://linkehoo.com/media.
    #
    # L'alias pointe sur le sous-dossier `images` : les documents de
    # vérification (privés) ne sont JAMAIS accessibles sans URL signée, même
    # si quelqu'un devine leur chemin.
    location /media/images/ {
        alias /var/lib/ilehya/storage/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── API ──
    location /api/ {
        limit_req zone=ilehya_api burst=60 nodelay;

        # Cache uniquement pour la whitelist de GET publics (voir maps above).
        # Cache actif seulement si URI ET méthode sont both "0" :
        # proxy_no_cache/proxy_cache_bypass bypassent si l'un des deux vaut 1.
        proxy_cache ilehya_api_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 30s;
        proxy_no_cache $api_uri_no_cache $api_method_no_cache;
        proxy_cache_bypass $api_uri_no_cache $api_method_no_cache;
        # Si le backend tombe, on sert la version en cache plutôt qu'une 502.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        # Un seul passage en amont pour une clé donnée (évite le dogpile).
        proxy_cache_lock on;

        proxy_pass http://ilehya_api;
        proxy_http_version 1.1;
        # Le header Connection est géré par $connection_upgrade (voir map above) :
        # vide pour le keepalive normal, "upgrade" pour les WebSockets Realtime.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUST_PROXY=1 côté API : sans ce header, le rate limiting de l'API
        # verrait toutes les requêtes venir de 127.0.0.1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Téléversements (plus stricts) ──
    location /api/upload {
        limit_req zone=ilehya_upload burst=5 nodelay;

        proxy_pass http://ilehya_api;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
        proxy_read_timeout 120s;
    }
}
