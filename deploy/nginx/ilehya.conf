# Nginx — Ilehya (VPS LWS, Ubuntu 24.04)
#
# Installation :
#   cp deploy/nginx/ilehya.conf /etc/nginx/sites-available/ilehya
#   ln -s /etc/nginx/sites-available/ilehya /etc/nginx/sites-enabled/
#   # le certificat est obtenu après avoir mis le site en HTTP :
#   certbot --nginx -d <domaine> -d www.<domaine>
#   nginx -t && systemctl reload nginx
#
# Remplacez ILEHYA_DOMAIN par le domaine réel avant le premier `nginx -t`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Limitation de débit (anti-abus avant même d'atteindre l'API) ──
limit_req_zone $binary_remote_addr zone=ilehya_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ilehya_upload:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ILEHYA_DOMAIN www.ILEHYA_DOMAIN;

    # Certbot réécrit ce bloc pour ajouter le HTTPS et le redirectionnement.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ILEHYA_DOMAIN www.ILEHYA_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/ILEHYA_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ILEHYA_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Sécurité ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;
    server_tokens off;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # ── Frontend (build Vite) ──
    root /var/www/ilehya;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Photos d'annonces (stockage disque) ──
    # Les URLs stockées en base sont `<STORAGE_PUBLIC_BASE_URL>/images/<fichier>`,
    # soit `https://<domaine>/media/images/<fichier>` avec
    # STORAGE_PUBLIC_BASE_URL=https://<domaine>/media.
    #
    # L'alias pointe sur le sous-dossier `images` : les documents de
    # vérification (privés) ne sont JAMAIS accessibles sans URL signée, même
    # si quelqu'un devine leur chemin.
    location /media/images/ {
        alias /var/lib/ilehya/storage/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── API ──
    location /api/ {
        limit_req zone=ilehya_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUST_PROXY=1 côté API : sans ce header, le rate limiting de l'API
        # verrait toutes les requêtes venir de 127.0.0.1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Téléversements (plus stricts) ──
    location /api/upload {
        limit_req zone=ilehya_upload burst=5 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
        proxy_read_timeout 120s;
    }
}
