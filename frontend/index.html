<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linkhoo — Location d'appartements non meublés &amp; hôtel</title>
  <meta name="description" content="Linkhoo vous accompagne dans la location d'appartements non meublés en longue durée et propose des chambres d'hôtel à la nuit. Louez en direct : zéro frais d'agence, zéro surprise." />

  <link rel="icon" type="image/jpeg" href="/logo.jpg" />

  <!-- PWA : manifest + icônes d'installation -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Polices Lato auto-hébergées (src/fonts.css) : aucune requête externe,
       la typographie survit hors-ligne. -->

  <!-- Polices auto-hébergées (src/fonts.css) : plus aucune requête tierce
       bloquante vers Google Fonts ou un CDN. Les fichiers critiques sont
       préchargés pour éviter le passage par la police de repli. -->
  <link rel="preload" href="/fonts/lato-9.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/caveat-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin />

  <!-- LCP de l'accueil : le fond du hero (CSS) et l'<img> du hero de marché
       pointent tous deux vers ce fichier — on le lance dès l'analyse du
       document au lieu de l'attendre après la CSS + le JS. -->
  <link rel="preload" as="image" type="image/webp" href="/images/hero-city.webp" fetchpriority="high" />

  <!-- Pré-ouverture des connexions tierces (DNS + TLS payés une fois) -->
  <link rel="preconnect" href="https://epic-sponge-8933.clerk.accounts.dev" crossorigin />
  <link rel="preconnect" href="https://bqzyclhnobizudnhscgv.supabase.co" crossorigin />

  <!-- Démarrage des requêtes de la page d'accueil AVANT le téléchargement du
       bundle : le JS React et les données arrivent en parallèle au lieu d'une
       après l'autre. Les promesses sont posées dans une Map lue par
       `cachedGet()` (src/lib/api.ts) — donc aucun doublon de requête.
       Un seul préchargement par navigation : accueil d'un marché (/ci…) ou
       racine (/), jamais sur une page profonde. -->
  <script>
    (function () {
      try {
        if (navigator.connection && navigator.connection.saveData) return;
        var path = location.pathname.replace(/\/+$/, '') || '/';
        var slug = path === '/' ? 'ci' : path.slice(1);
        if (slug.indexOf('/') !== -1) return; // page profonde : on n'anticipe pas
        var market = slug.toUpperCase();
        var paths = path === '/'
          ? ['/categories?market=CI']
          : [
              '/banners?market=' + market,
              '/rooms/popular?market=' + market,
              '/rooms?market=' + market,
              '/categories?market=' + market,
              '/events?market=' + market,
              '/tourism?market=' + market,
              '/escapades?market=' + market,
              '/reviews/featured',
            ];
        var map = new Map();
        paths.forEach(function (apiPath) {
          // La clé inclut /api : c'est la clé lue par takePrefetched() dans
          // src/lib/api.ts, qui reçoit des chemins sans préfixe.
          map.set('/api' + apiPath, fetch('/api' + apiPath, { cache: 'no-cache' })
            .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error(String(res.status))); }));
        });
        window.__LINKHOO_PREFETCH__ = map;
      } catch (_) { /* la page reste entièrement fonctionnelle sans ça */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
